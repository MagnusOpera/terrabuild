name: 📦 Prepare Release
run-name: Prepare release ${{github.ref_name}}

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Info
        run: echo 'Building ${{ github.ref }}'

      - name: Cloning repository
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-next)?$ ]]; then
            echo "::error::Expected vX.Y.Z or vX.Y.Z-next."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_SUFFIX=${BASH_REMATCH[4]:-}" >> "$GITHUB_ENV"

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          install_dotnet: "true"
          install_node: "true"
          install_pnpm: "true"
          install_fscript: "false"

      - name: Build & Publish
        run: make publish-all config=Release version=${{ env.BUILD_VERSION }}

      - name: Pack
        run: |
          (cd .out/dotnet; zip -r "../terrabuild-${BUILD_VERSION}-dotnet.zip" ./*)
          (cd .out/windows/x64; zip "../../terrabuild-${BUILD_VERSION}-windows-x64.zip" ./*)
          (cd .out/windows/arm64; zip "../../terrabuild-${BUILD_VERSION}-windows-arm64.zip" ./*)
          (cd .out/linux/x64; zip "../../terrabuild-${BUILD_VERSION}-linux-x64.zip" ./*)
          (cd .out/linux/arm64; zip "../../terrabuild-${BUILD_VERSION}-linux-arm64.zip" ./*)
          cp entitlements.plist .out/darwin/entitlements.plist
          (cd .out/darwin; zip -r "../terrabuild-${BUILD_VERSION}-darwin-unsigned.zip" ./*)

      - name: Extract release notes from changelog
        shell: bash
        run: |
          ./.github/scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2.0.6
        with:
          draft: true
          prerelease: ${{ env.BUILD_VERSION_SUFFIX != '' }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            .out/*.zip
            .out/*.nupkg
