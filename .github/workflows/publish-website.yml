name: 🌍 Publish Website
run-name: Publish website from ${{ github.event_name == 'push' && github.ref_name || 'main' }}

on:
  push:
    tags:
      - 'website-*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrabuild-website
  cancel-in-progress: false

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Generate documentation and build website
        run: make website-build

      - name: Publish website to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy
          wranglerVersion: "4.124.0"
