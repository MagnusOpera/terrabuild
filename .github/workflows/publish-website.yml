name: 🌍 Publish Website
run-name: Publish website from ${{ github.event_name == 'push' && github.ref_name || 'main' }}

on:
  push:
    tags:
      - 'website-*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrabuild-website
  cancel-in-progress: false

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Tools
        uses: ./.github/actions/setup-tools
        with:
          install_dotnet: "true"
          install_node: "true"
          install_pnpm: "true"
          node_cache: pnpm
          node_cache_dependency_path: website/pnpm-lock.yaml
          install_fscript: "false"

      - name: Generate documentation and build website
        run: make website-build

      - name: Publish website to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy
          wranglerVersion: "4.124.0"
